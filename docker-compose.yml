services:
  jupyter:
    build:
      context: .
      dockerfile: docker/jupyter.Dockerfile
    container_name: aviation-jupyter
    user: root
    ports:
      - "8888:8888"
      - "4040-4042:4040-4042"
    env_file:
      - .env
    environment:
      JUPYTER_ENABLE_LAB: "yes"
      JUPYTER_TOKEN: "${JUPYTER_TOKEN}"
      # Run the notebook server as the host VM user so .ipynb saves from
      # Jupyter persist directly into the bind-mounted repository.
      NB_UID: "${HOST_UID:-1002}"
      NB_GID: "${HOST_GID:-1005}"
      CHOWN_HOME: "yes"
      # Override SPARK_HOME to use pip-installed pyspark 4.0.0 JARs,
      # NOT the base image's pre-installed Spark 4.1.1 at /usr/local/spark.
      # Driver and cluster must use the same version JARs.
      SPARK_HOME: /opt/conda/lib/python3.13/site-packages/pyspark
      # Tell PySpark which Python workers should use (must match driver = 3.13)
      PYSPARK_PYTHON: python3.13
    volumes:
      - ./:/home/jovyan/work
      - ./:/workspace
      - spark-models:/spark-models
    depends_on:
      - minio
      - kafka
    networks:
      - aviation-net

  minio:
    image: minio/minio:latest
    container_name: aviation-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - .env
    volumes:
      - minio-data:/data
    networks:
      - aviation-net

  mc:
    image: minio/mc:latest
    container_name: aviation-mc
    depends_on:
      - minio
    env_file:
      - .env
    entrypoint: >
      /bin/sh -c " sleep 8; mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; mc mb -p local/raw || true; mc mb -p local/lakehouse || true; mc mb -p local/warehouse || true; mc mb -p local/mlflow || true; mc ls local; exit 0; "
    networks:
      - aviation-net

  kafka:
    image: apache/kafka:3.7.0
    container_name: aviation-kafka
    hostname: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - aviation-net
  spark-master:
    build:
      context: .
      dockerfile: docker/spark.Dockerfile
    container_name: aviation-spark-master
    environment:
      SPARK_MODE: master
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8080
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - ./:/workspace
      - spark-models:/spark-models
    networks:
      - aviation-net

  spark-worker:
    build:
      context: .
      dockerfile: docker/spark.Dockerfile
    container_name: aviation-spark-worker
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 4G
      SPARK_WORKER_CORES: 2
    depends_on:
      - spark-master
    ports:
      - "8081:8081"
    volumes:
      - ./:/workspace
      - spark-models:/spark-models
    networks:
      - aviation-net

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    container_name: aviation-mlflow
    command: >
      mlflow server --backend-store-uri sqlite:////mlflow/mlflow.db --serve-artifacts --artifacts-destination /mlflow/artifacts --host 0.0.0.0 --port 5000
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - mlflow-data:/mlflow
    depends_on:
      - minio
      - mc
    networks:
      - aviation-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: aviation-kafka-ui
    ports:
      - "8085:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: aviation-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - aviation-net

  airflow:
    image: apache/airflow:3.2.1
    container_name: aviation-airflow
    command: standalone
    ports:
      - "8088:8080"
    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - airflow-data:/opt/airflow
      - ./dags:/opt/airflow/dags
      - ./:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
    depends_on:
      - jupyter
    networks:
      - aviation-net

  aviation-api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: aviation-api
    environment:
      AVIATION_MODEL_PATH: /models/final_numeric_logistic_model.json
    volumes:
      - ./models:/models:ro
    ports:
      - "3000:3000"
    networks:
      - aviation-net

  llm-chat:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: aviation-llm-chat
    command:
      - python
      - -m
      - api.llm_chat_ui
      - --host
      - 0.0.0.0
      - --port
      - "7860"
      - --prometheus-url
      - http://prometheus:9090
    env_file:
      - .env
    environment:
      PROMETHEUS_URL: http://prometheus:9090
    volumes:
      - ./data/local_cache/live_predictions:/workspace/data/local_cache/live_predictions:ro
    ports:
      - "7860:7860"
    depends_on:
      - prometheus
    networks:
      - aviation-net

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: aviation-prometheus
    command: --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./dashboards/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - aviation-api
    networks:
      - aviation-net

  grafana:
    image: grafana/grafana:12.1.0
    container_name: aviation-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./dashboards/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards/aviation-api-dashboard.json:/var/lib/grafana/dashboards/aviation-api-dashboard.json:ro
      - ./dashboards/simulation-stream-dashboard.json:/var/lib/grafana/dashboards/simulation-stream-dashboard.json:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - aviation-net

volumes:
  minio-data:
  kafka-data:
  mlflow-data:
  spark-models:
  airflow-data:
  grafana-data:

networks:
  aviation-net:
    driver: bridge
